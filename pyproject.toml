[project]
name = "nyc-zr"
version = "0.2.0"
description = "NYC Zoning Resolution, scraped into searchable markdown + SQLite FTS, with a CLI and an MCP server"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "requests>=2.31",
    "pyyaml>=6",
    "mcp>=2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
